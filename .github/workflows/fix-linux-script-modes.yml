name: Fix Linux script modes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-modes:
    if: github.event.head_commit.message != 'chore: fix Linux script modes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore executable modes
        run: |
          chmod +x zcode-linux uninstall-linux.sh scripts/tests/test-zcode-linux.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add zcode-linux uninstall-linux.sh scripts/tests/test-zcode-linux.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: fix Linux script modes"
          git push
